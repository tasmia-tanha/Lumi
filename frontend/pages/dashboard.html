<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../stylesheet/dashboard.css">
</head>
<body>
    <div class="main">
        <div class="left">
            <img src="../images/Lumi Sprout Heart Logo.png">
            <div class="navbar">
                <ul id="list">
                    <li>Dashboard</li>
                    <li>Tasks</li>
                    <li>Calendar</li>
                    <li>Note</li>
                    <li>Lessons</li>
                    <li>Assignments</li>
                    <li>Analytics</li>
                </ul>
            </div>
            <button class="logout">Log Out</button>
        </div>
        <div class="right">
            <div class="greeting">
                <div class="left-greet">
                    <img id="greetLogo" src="../images/Kawaii Capybara With Flower.png">
                    <p id="greetMsg">Welcome Back <br>
                                        Tanha!</p>
                </div>
                <p id="date">15th October,2026<br>
                                12.15 AM</p>
            </div>

            <div class="schedule">
                <table>
                    <th>
                        <td>Sun</td>
                        <td>9.00-9.45</td>
                        <td>9.45-10.30</td>
                        <td>10.45-11.30</td>
                        <td>11.30-12.15</td>
                        <td>12.15-1.00</td>
                        <td>2.00-4.00</td>
                    </th>
                    <tr>
                        <td>DS</td>
                        <td>FL</td>
                        <td>DLD</td>
                        <td>HUM</td>
                        <td>AS</td>
                        <td>LAB</td>
                    </tr>
                </table>
            </div>

            
        </div>
    </div>    
</body>
</html>
